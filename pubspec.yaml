name: medbridge
description: MedBridge - Smart Healthcare Appointment & Medical Records Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  flutter_local_notifications: ^19.0.0
  image_picker: any
  table_calendar: ^3.1.3
  pdf: ^3.11.2
  printing: ^5.13.4
  shared_preferences: any
  timezone: any
  intl: any
  google_fonts: any
  url_launcher: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#E6F5F2"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
